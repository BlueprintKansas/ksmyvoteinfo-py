[project]
name = "ksmyvoteinfo"
version = "1.8"
description = "Query the KS SOS site for voter registration"
authors = [
    {name = "Peter Karman", email = "peter@peknet.com"},
]
dependencies = [
    "beautifulsoup4",
    "python-dateutil",
    "requests",
    "Werkzeug",
]
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Homepage = "http://github.com/BlueprintKansas/ksmyvoteinfo-py"
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
